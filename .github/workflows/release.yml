name: Build and release

# Every push to main builds Authenticator.exe and publishes it as a GitHub release.
# Installed copies of the app check this repository's latest release and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race; finish one before starting the next.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project tests/Authenticator.Core.Tests -c Release

      - name: Restore
        run: dotnet restore src/Authenticator.App -r win-x64 -p:Platform=x64

      - name: Publish single-file exe
        run: >
          dotnet publish src/Authenticator.App -c Release -r win-x64 --no-restore
          -p:Platform=x64
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Authenticator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # The app's updater verifies downloads against this file.
          [IO.File]::WriteAllText("out/Authenticator.exe.sha256", "$hash  Authenticator.exe`n")
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Download **Authenticator.exe** and run it. No installer or .NET install needed.
          Already using Authenticator? It updates itself from this page automatically.

          SHA-256: ``$((Get-Content out/Authenticator.exe.sha256).Split(' ')[0])``
          "@
          gh release create "v$env:VERSION" out/Authenticator.exe out/Authenticator.exe.sha256 `
            --title "Authenticator $env:VERSION" `
            --target "$env:GITHUB_SHA" `
            --notes "$notes" `
            --generate-notes `
            --latest
