[workspace]
members = ["."]
resolver = "3"

[package]
name = "authenticator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Offline Windows authenticator with an encrypted local vault"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "Authenticator"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
data-encoding = "=2.11.1"
totp-rs = { version = "=6.0.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "=1.9.1"
subtle = "=2.6.1"
sha2 = "=0.11.1"
caseless = "=0.2.2"
uuid = { version = "=1.29.2", features = ["v4"] }
url = "=2.5.8"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
quircs = "=0.10.3"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
qrcode = { version = "=0.14.1", default-features = false }
tempfile = "3.27"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "=0.1.34"
