[workspace]
members = ["."]
resolver = "3"

[package]
name = "authenticator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Offline Windows authenticator with an encrypted local vault"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "Authenticator"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
data-encoding = "=2.11.1"
totp-rs = { version = "=6.0.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "=1.9.1"
subtle = "=2.6.1"
uuid = { version = "=1.29.2", features = ["v4"] }
url = "=2.5.8"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
