  <path d="M128 90 A38 38 0 1 1 90 128" fill="none" stroke="#7C3AED" stroke-width="13" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="128" cy="120" r="10" fill="#5B21B6"/>
  <path d="M123 124 H133 L136 146 H120 Z" fill="#5B21B6"/>
